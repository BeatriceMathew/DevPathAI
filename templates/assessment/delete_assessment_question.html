{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Question | DevPath AI</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }
        /* ================= ADMIN SIDEBAR ================= */

.admin-sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 280px;
    height: 100vh;

    background: #064c42;
    color: white;

    display: flex;
    flex-direction: column;

    padding: 28px 16px;

    overflow-y: auto;
    z-index: 1000;
}

.admin-logo {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 12px 28px;
}

.logo-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;

    background: #e8f3ee;
    color: #064c42;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
}

.logo-text span {
    font-size: 23px;
    font-weight: 700;
}

.admin-profile {
    display: flex;
    align-items: center;
    gap: 14px;

    padding: 18px;
    margin-bottom: 25px;

    border-radius: 18px;
    background: rgba(255,255,255,0.08);
}

.profile-icon {
    width: 52px;
    height: 52px;
    min-width: 52px;

    border-radius: 50%;

    background: #e8f3ee;
    color: #064c42;

    display: flex;
    align-items: center;
    justify-content: center;
}

.profile-details {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.profile-details strong {
    font-size: 16px;
}

.profile-details small {
    color: #b8d8d0;
    font-size: 13px;
}

.admin-menu {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.admin-sidebar a {
    display: flex;
    align-items: center;
    gap: 15px;

    width: 100%;

    padding: 14px 16px;

    color: white;
    text-decoration: none;

    border-radius: 13px;

    font-size: 15px;
    font-weight: 500;

    transition: 0.2s;
}

.admin-sidebar a i {
    width: 22px;
    min-width: 22px;
    text-align: center;
}

.admin-sidebar a:hover {
    background: rgba(255,255,255,0.10);
}

.admin-sidebar .admin-nav-link {
    background: #e8f3ee;
    color: #064c42;
    font-weight: 700;
}

.sidebar-bottom {
    margin-top: auto;

    padding-top: 18px;

    border-top: 1px solid rgba(255,255,255,0.15);

    display: flex;
    flex-direction: column;
    gap: 5px;
}

/* ================= MAIN CONTENT ================= */

.admin-layout {
    min-height: 100vh;
}

.admin-main {
    margin-left: 280px;
    width: calc(100% - 280px);
    min-height: 100vh;
}

.page {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 40px 25px;
}

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f6ee;
            color: #073f38;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .admin-main {
            flex: 1;
        }

        .delete-container {
            max-width: 650px;
            margin: 100px auto;
            padding: 30px;
        }

        .delete-card {
            background: white;
            border: 1px solid #e2e8e5;
            border-radius: 18px;
            padding: 40px;
            text-align: center;
        }

        .warning-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fff0ef;
            color: #a43d36;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        h1 {
            margin-bottom: 12px;
        }

        .question {
            margin: 25px 0;
            padding: 18px;
            background: #f8faf9;
            border-radius: 10px;
            color: #526a65;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .cancel,
        .delete {
            padding: 12px 20px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 600;
        }

        .cancel {
            border: 1px solid #d9e4df;
            color: #526a65;
        }

        .delete {
            border: none;
            background: #b4433b;
            color: white;
            cursor: pointer;
        }

    </style>

</head>


<body>

<div class="admin-layout">

    {% include "components/sidebar.html" %}


    <main class="admin-main">

        <div class="delete-container">

            <div class="delete-card">

                <div class="warning-icon">

                    <i class="fas fa-trash"></i>

                </div>


                <h1>
                    Delete Assessment Question?
                </h1>


                <p>
                    Are you sure you want to delete this question?
                    This action cannot be undone.
                </p>


                <div class="question">

                    {{ question.question }}

                </div>


                <div class="actions">

                    <a href="{% url 'admin_assessment_questions' %}"
                       class="cancel">

                        Cancel

                    </a>


                    <form method="POST">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="delete">

                            <i class="fas fa-trash"></i>
                            Delete Question

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </main>

</div>

</body>

</html>
