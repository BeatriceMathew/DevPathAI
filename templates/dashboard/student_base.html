{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        DevPath AI
        {% endblock %}
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- Student Layout CSS -->

    <link rel="stylesheet"
          href="{% static 'css/student_base.css' %}">


    {% block extra_css %}
    {% endblock %}

</head>


<body>


    <div class="student-layout">


        <!-- SIDEBAR -->

        {% include 'components/student_sidebar.html' %}


        <!-- MAIN AREA -->

        <main class="student-main">

            {% block content %}
            {% endblock %}

        </main>


    </div>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
